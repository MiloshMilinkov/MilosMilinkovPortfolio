<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image template</title>
    <style>
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA;
      }
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-cyrillic-wght-normal.woff2') format('woff2');
        unicode-range: U+0400-04FF;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background:
          radial-gradient(ellipse 50% 70% at 92% 0%, rgb(212 140 248 / 0.28), transparent 65%),
          radial-gradient(ellipse 45% 60% at 70% -10%, rgb(106 79 223 / 0.3), transparent 70%),
          radial-gradient(ellipse 40% 50% at 0% 100%, rgb(126 224 195 / 0.08), transparent 70%),
          #0f1221;
        color: #eef0f8;
        font-family: 'Geist', sans-serif;
        display: grid;
        grid-template-columns: 1fr 340px;
        align-items: center;
        gap: 56px;
        padding: 0 80px;
      }
      .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border: 1px solid rgb(255 255 255 / 0.14); border-radius: 999px; background: rgb(255 255 255 / 0.04); color: #eef0f8; font-size: 22px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #7ee0c3; box-shadow: 0 0 0 5px rgb(126 224 195 / 0.18); }
      h1 { margin: 28px 0 22px; font-size: 76px; font-weight: 650; line-height: 1.02; letter-spacing: -0.045em; }
      p { margin: 0; font-size: 28px; color: #b8bdd2; }
      .card { padding: 22px; border-radius: 26px; border: 1px solid rgb(196 204 255 / 0.1); background: linear-gradient(180deg, #1d2238, #171b2f); box-shadow: 0 30px 60px -30px #000; }
      .card img { width: 100%; height: 300px; object-fit: cover; object-position: 50% 25%; border-radius: 18px; display: block; }
      .name { margin-top: 18px; font-size: 26px; font-weight: 600; }
      .role { margin-top: 4px; font-size: 19px; color: #b8bdd2; }
    </style>
  </head>
  <body>
    <div>
      <span class="pill"><span class="dot"></span><span id="pill">Websites and web apps for businesses</span></span>
      <h1 id="headline">Fast, modern websites that bring you clients.</h1>
      <p id="role">Miloš Milinkov · full-stack developer, Belgrade</p>
    </div>
    <div class="card">
      <img src="../../public/images/portrait-506.webp" alt="" />
      <div class="name">Miloš Milinkov</div>
    </div>
  </body>
</html>

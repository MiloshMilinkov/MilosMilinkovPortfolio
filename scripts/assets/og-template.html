<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image template</title>
    <style>
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background:
          radial-gradient(ellipse 55% 75% at 92% 0%, rgb(217 70 239 / 0.35), transparent 65%),
          radial-gradient(ellipse 40% 50% at 0% 100%, rgb(34 211 238 / 0.08), transparent 70%),
          #121216;
        color: #f4f4f6;
        font-family: 'Geist', sans-serif;
        display: grid;
        grid-template-columns: 1fr 340px;
        align-items: center;
        gap: 56px;
        padding: 0 80px;
      }
      .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border: 1px solid rgb(255 255 255 / 0.14); border-radius: 999px; background: rgb(255 255 255 / 0.04); color: #a6a6b0; font-size: 22px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #e055f5; box-shadow: 0 0 0 5px rgb(217 70 239 / 0.15); }
      h1 { margin: 28px 0 22px; font-size: 76px; font-weight: 650; line-height: 1.02; letter-spacing: -0.045em; }
      p { margin: 0; font-size: 28px; color: #a6a6b0; }
      .card { padding: 22px; border-radius: 26px; border: 1px solid rgb(255 255 255 / 0.08); background: linear-gradient(180deg, #23232b, #1b1b21); box-shadow: 0 30px 60px -30px #000; }
      .card img { width: 100%; height: 300px; object-fit: cover; object-position: 50% 25%; border-radius: 18px; display: block; }
      .name { margin-top: 18px; font-size: 26px; font-weight: 600; }
      .role { margin-top: 4px; font-size: 19px; color: #a6a6b0; }
    </style>
  </head>
  <body>
    <div>
      <span class="pill"><span class="dot"></span>Websites and web apps for businesses</span>
      <h1>Fast, modern websites that bring you clients.</h1>
      <p>Miloš Milinkov · full-stack developer, Belgrade</p>
    </div>
    <div class="card">
      <img src="../../public/images/portrait-360.webp" alt="" />
      <div class="name">Miloš Milinkov</div>
      <div class="role">Design · build · hosting</div>
    </div>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (prerender)
        run: npm run build

      - name: Validate HTML
        run: npm run validate:html

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      # Chromium + Firefox here; WebKit runs locally (Firefox cannot launch on the dev machine).
      - name: End-to-end tests
        run: npx playwright test --project=chromium --project=firefox
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
